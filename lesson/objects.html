const rbox = (w, h, d, r, mat, x, y, z, p) => mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3)), mat, x, y, z, p);

const keysTex = (cols, rows, w = 1024, h = 420) => canvas(w, h, (c) => {

  }
});

  const spout = new THREE.CatmullRomCurve3([V(0.6, 0.3, 0), V(0.9, 0.45, 0), V(1.08, 0.72, 0), V(1.2, 0.86, 0)]);
  mesh(new THREE.TubeGeometry(spout, 32, 0.07, 16), steel, 0, 0, 0, g);
  const handle = new THREE.CatmullRomCurve3([V(-0.45, 0.95, 0), V(-0.3, 1.45, 0), V(0.3, 1.45, 0), V(0.45, 0.95, 0)]);
  mesh(new THREE.TubeGeometry(handle, 40, 0.06, 16), blk, 0, 0, 0, g);
  return g;
};

B["red-brick"] = () => {
  const g = new THREE.Group();
  const tex = canvas(256, 128, (c, W, H) => { c.fillStyle = "#A8432C"; c.fillRect(0, 0, W, H); for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(${Math.random() < 0.5 ? "60,20,10" : "220,140,110"},${Math.random() * 0.25})`; c.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 4, 2 + Math.random() * 3); } });
  rbox(2.2, 0.65, 1.05, 0.05, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }), 0, 0.325, 0, g);
  return g;
};

B["folded-cotton-saree"] = () => {
  const g = new THREE.Group();
  const cloth = (base, border) => canvas(512, 256, (c, W, H) => { c.fillStyle = base; c.fillRect(0, 0, W, H); c.fillStyle = border; c.fillRect(0, H - 52, W, 52); c.fillStyle = "#F2C94C"; for (let x = 8; x < W; x += 28) { c.beginPath(); c.arc(x, H - 26, 7, 0, 7); c.fill(); } c.strokeStyle = "rgba(255,255,255,.18)"; for (let y = 12; y < H - 60; y += 22) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } });
  [["#C8324B", "#7A1C33"], ["#1F8A8A", "#0E4D57"], ["#E8A33D", "#8A4B12"]].forEach(([a, b], i) => {
    const t = cloth(a, b);
    rbox(1.8, 0.24, 1.2, 0.1, new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 }), 0.04 * (i - 1), 0.12 + i * 0.25, 0.03 * i, g);
  });
  return g;
};

const ex = new GLTFExporter();
window.GLB = {};
for (const [name, build] of Object.entries(B)) {
  const scene = new THREE.Scene(); const obj = build(); obj.name = name; scene.add(obj);
  const buf = await ex.parseAsync(scene, { binary: true });
  window.GLB[name] = btoa(new Uint8Array(buf).reduce((s, b) => s + String.fromCharCode(b), ""));
}
window.DONE = true;
</script></body></html>
