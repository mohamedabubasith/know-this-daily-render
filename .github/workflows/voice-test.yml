name: voice-test
# Tamil voice samples on a plain CPU runner (no GPU), for the owner to compare. Runs on pushes to the voice-test branch.
on:
  push:
    branches: [voice-test]
permissions:
  contents: read
jobs:
  pocket:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pocket TTS Tamil
        run: |
          uv venv --python 3.12 .p
          uv pip install --python .p torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .p pocket-tts soundfile huggingface_hub
          .p/bin/python voicetest/pocket.py voicetest out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pocket, path: out/, if-no-files-found: ignore}
  piper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Piper Tamil (HemaLatha, Valluvar)
        run: |
          uv venv --python 3.12 .pi && uv pip install --python .pi piper-tts huggingface_hub
          mkdir -p out
          for v in ta_IN-HemaLatha-medium ta_IN-ValluvarNeural-medium; do
            .pi/bin/python -c "from huggingface_hub import hf_hub_download as d; [d('Jeyaram-K/piper-tamil-voices', '$v/$v.onnx' + x, local_dir='pv') for x in ('', '.json')]"
            n=0
            while IFS= read -r line; do
              n=$((n+1)); t=$(date +%s.%N)
              echo "$line" | .pi/bin/piper --model "pv/$v/$v.onnx" --config "pv/$v/$v.onnx.json" --output_file "out/piper-$v-line$n.wav" 2>/dev/null
              echo "$v line $n: in $(echo "$(date +%s.%N) - $t" | bc)s"
            done < voicetest/lines.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: piper, path: out/, if-no-files-found: ignore}
