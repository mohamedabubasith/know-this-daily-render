name: voice-test
# Tamil voice samples on a plain CPU runner (no GPU), for the owner to compare. Runs on pushes to the voice-test branch.
on:
  push:
    branches: [voice-test]
permissions:
  contents: read
jobs:
  zonos3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: ZONOS3-Mini (C++/ggml build, CPU)
        run: |
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/Zyphra/ZONOS3-Mini.git "$HOME/z"
          cd "$HOME/z/servers/ggml"
          cmake -B build -DCMAKE_BUILD_TYPE=Release >/dev/null && cmake --build build -j4 2>&1 | tail -2
          uvx --from huggingface_hub hf download Zyphra/ZONOS3-Mini gguf/backbone-ptq.gguf gguf/zac-keep2.gguf gguf/spk-encoder.gguf --local-dir . >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/out"; n=0
          while IFS= read -r line; do
            n=$((n+1)); t=$(date +%s)
            ./build/zonos3-cli gguf/backbone-ptq.gguf --tts "$line" "$GITHUB_WORKSPACE/out/zonos3-line$n.wav" \
              --clone "$GITHUB_WORKSPACE/voicetest/kayal.mp3" --seed 1 2>&1 | tail -3
            echo "line $n: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$GITHUB_WORKSPACE/out/zonos3-line$n.wav")s of speech in $(( $(date +%s) - t ))s"
          done < "$GITHUB_WORKSPACE/voicetest/lines.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: zonos3, path: out/, if-no-files-found: ignore}
  omnivoice:
    if: ${{ !contains(github.event.head_commit.message, 'zonos only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: OmniVoice
        run: |
          uv venv --python 3.12 .ov
          uv pip install --python .ov torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .ov omnivoice soundfile
          .ov/bin/python voicetest/omni.py voicetest out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: omnivoice, path: out/, if-no-files-found: ignore}
