name: voice-test
# Kayal (Maya 2 Native, Apache-2.0) on a plain CPU runner: no GPU. Reads part 4's real script.
on:
  push:
    branches: [voice-test]
permissions:
  contents: read
jobs:
  kayal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kayal on CPU
        run: |
          git clone -q --depth 1 https://github.com/MayaResearch/maya2-native voicetest/maya
          uv venv -q --python 3.12 .e
          uv pip install -q --python .e "torch==2.8.0" "torchaudio==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install -q --python .e "transformers==5.6.2" "tokenizers>=0.22,<0.23" numpy scipy soundfile "huggingface_hub>=1.0" safetensors pyyaml
          mkdir -p out
          .e/bin/python -I voicetest/kayal_cpu.py voicetest/p4lines.txt out/kayal-cpu-part4.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kayal, path: out/, if-no-files-found: ignore}
