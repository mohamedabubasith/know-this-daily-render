<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Shot list, timings and words of this film, written by the pipeline -->
    <script src="assets/film.js"></script>
    <!-- Animated scene builders for "anim" shots -->
    <!-- The continents, for the globe scene -->
    <script src="assets/land.js"></script>
    <script src="assets/anim.js"></script>
    <style>
      /* The "editorial" look: a paper page, the picture in a framed card, serif titles, a marker for the key word.
         Top to bottom: header, the picture card, the title under it, the caption. Everything a viewer must read ends by
         y=1570: YouTube Shorts lays its own channel name and buttons over what is below. */
      @font-face { font-family: "Noto Sans Tamil"; src: url("assets/fonts/NotoSansTamil.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.ttf"); font-weight: 100 900; }
      :root {
        --ink: #1c1a17;
        --paper: #f3ecdd;
        --card: #fffaf0;
        --accent: #c2491d;
        --mark: color-mix(in srgb, var(--accent) 36%, transparent);
        --font-display: "Fraunces", "Noto Sans Tamil", serif;
        --font-text: "Inter", "Noto Sans Tamil", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-text); color: var(--ink); }
      #film, .layer, #gfx, #subs, #overlays { position: absolute; inset: 0; }
      #film { overflow: hidden; background: var(--paper); }
      #dots-bg { z-index: 0; background: radial-gradient(rgba(28, 26, 23, 0.07) 1.3px, transparent 1.4px) 0 0 / 10px 10px; }
      #frame { z-index: 1; } #gfx { z-index: 2; } #head, #hook, #overlays { z-index: 4; } #subs, #sub-rule { z-index: 5; }
      #grain { z-index: 6; } #endcard { z-index: 10; }

      /* The picture card. Its height moves: it makes room for a title under it, then grows back. */
      #frame { position: absolute; left: 80px; top: 236px; width: 898px; height: 1110px; border-radius: 40px; overflow: hidden;
        border: 4px solid var(--ink); box-shadow: 22px 22px 0 var(--accent); background: var(--ink); isolation: isolate; }
      #shots { position: absolute; inset: 0; z-index: 0; isolation: isolate; }
      #grade { z-index: 1; mix-blend-mode: soft-light; } #leak { z-index: 2; } #vignette { z-index: 3; } #flash { z-index: 4; opacity: 0; } #tags { z-index: 5; }
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .fx, .cam { position: absolute; inset: 0; }
      /* A 9:16 picture, centred on the card whatever the card's height is. */
      #shots .cam img { position: absolute; left: 0; top: 50%; width: 898px; height: 1597px; margin-top: -798px; object-fit: cover; }
      #leak { position: absolute; mix-blend-mode: screen; width: 1300px; height: 1300px; left: -200px; top: -220px;
        background: radial-gradient(closest-side at 50% 50%, rgba(255, 170, 80, 0.9), rgba(255, 90, 60, 0.35) 45%, rgba(255, 60, 60, 0) 75%); }
      #vignette { background: radial-gradient(ellipse 80% 70% at 50% 46%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.38) 100%); }
      #tags .ov-label { position: absolute; left: 30px; bottom: 30px; max-width: 800px; padding: 14px 26px; border-radius: 999px; background: var(--paper);
        border: 3px solid var(--ink); font: 800 30px/1.1 var(--font-text); letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; }

      /* Animated graphics take the whole page; their paper travels with the transition. */
      #gfx .fx { background: var(--paper); }
      .anim-stage { position: absolute; inset: 0; overflow: hidden; }
      .anim-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .anim-title { position: absolute; left: 80px; right: 80px; top: 232px; font: 900 100px/1.04 var(--font-display); letter-spacing: -0.025em; text-wrap: balance; }
      .anim-title .hl { background: linear-gradient(transparent 80%, var(--accent) 80%, var(--accent) 93%, transparent 93%) no-repeat 0 0 / 0% 100%; }
      .anim-note { position: absolute; left: 80px; width: 520px; font: 900 72px/1.06 var(--font-display); letter-spacing: -0.02em; }
      .anim-pic { position: absolute; width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 4px solid var(--ink); box-shadow: 14px 14px 0 var(--accent); }
      .anim-pin-label { position: absolute; left: 0; right: 0; top: 1240px; margin: 0 auto; width: fit-content; max-width: 860px; padding: 16px 30px; border-radius: 999px;
        background: var(--card); border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); font: 800 40px/1.1 var(--font-text); text-align: center; }

      /* Header: channel, what kind of film this is, and one dot for every shot. */
      #head { position: absolute; left: 80px; right: 80px; top: 100px; }
      #head .row { display: flex; justify-content: space-between; align-items: center; font: 800 28px/1 var(--font-text); letter-spacing: 0.16em; }
      #head .row b { display: flex; align-items: center; gap: 14px; font-weight: 800; }
      #head .row svg { width: 40px; height: 40px; border-radius: 10px; }
      #kicker { color: var(--accent); }
      #head-rule { height: 3px; margin-top: 20px; background: var(--ink); transform-origin: 0 50%; }
      #dots { display: flex; gap: 10px; margin-top: 16px; }
      #dots i { width: 34px; height: 8px; border-radius: 4px; background: rgba(28, 26, 23, 0.18); position: relative; overflow: hidden; }
      #dots i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(var(--p, 0)); transform-origin: 0 50%; }

      /* The hook and the big on-screen words live in the title zone, under the card. */
      #hook { position: absolute; left: 80px; right: 80px; top: 1128px; font: 900 116px/1 var(--font-display); letter-spacing: -0.025em; text-wrap: balance; }
      #hook.long { font-size: 86px; }
      #hook.ta, .ov.ta, .anim-title.ta { line-height: 1.22; letter-spacing: 0; }
      #hook .w { display: inline-block; opacity: 0; }
      #hook .hl { background: linear-gradient(transparent 82%, var(--accent) 82%, var(--accent) 94%, transparent 94%) no-repeat 0 0 / 0% 100%; }
      .ov { position: absolute; left: 80px; right: 80px; top: 1132px; opacity: 0; }
      .ov-big { font: 900 116px/1 var(--font-display); letter-spacing: -0.025em; }
      .ov-count .num { font: 900 150px/1 var(--font-display); letter-spacing: -0.03em; color: var(--accent); white-space: nowrap; }
      .ov-count .sfx { font-size: 80px; margin-left: 10px; }
      .ov-count .cap { margin-top: 10px; font: 800 40px/1.1 var(--font-text); letter-spacing: 0.06em; text-transform: uppercase; }

      /* Captions: under the card, a few words at a time, the key word under a marker. */
      #sub-rule { position: absolute; left: 80px; width: 920px; top: 1400px; height: 3px; background: var(--ink); transform-origin: 0 50%; }
      .sub { position: absolute; left: 80px; width: 900px; top: 1426px; font: 700 60px/1.2 var(--font-text); opacity: 0; text-wrap: balance; }
      .sub.ta { line-height: 1.4; font-size: 50px; }
      .sub b { font-weight: 800; background: linear-gradient(transparent 56%, var(--mark) 56%) no-repeat 0 0 / 0% 100%; }

      #grain { background: url("assets/grain.png") repeat; opacity: 0.06; mix-blend-mode: multiply; left: -256px; top: -256px; right: -256px; bottom: -256px; }

      #endcard { opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; background: var(--paper); padding-bottom: 220px; }
      #endcard svg { width: 230px; height: 230px; border-radius: 52px; border: 4px solid var(--ink); box-shadow: 14px 14px 0 var(--accent); }
      #end-name { font: 900 96px/1 var(--font-display); letter-spacing: -0.025em; }
      #end-line { font: 700 44px/1.3 var(--font-text); text-align: center; padding: 0 120px; }
      #end-line b { background: linear-gradient(transparent 56%, var(--mark) 56%); font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920" data-motion-blur="on">
      <div id="film" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="dots-bg" class="layer" data-layout-ignore></div>
        <div id="frame">
          <div id="shots">
__SHOTS__
          </div>
          <div id="grade" class="layer"></div>
          <div id="leak" data-layout-ignore></div>
          <div id="vignette" class="layer"></div>
          <div id="flash" class="layer"></div>
          <div id="tags" class="layer"></div>
        </div>
        <div id="gfx">
__GFX__
        </div>
        <div id="head">
          <div class="row"><b><svg viewBox="0 0 800 800"><rect width="800" height="800" fill="#FFD21F"/><g stroke="#14163A" stroke-width="26" stroke-linecap="round"><path d="M400 70v60M178 150l42 44M622 150l-42 44M92 360h60M708 360h-60"/></g><path d="M400 170c-112 0-196 86-196 190 0 70 36 122 82 160 22 18 30 40 30 66h168c0-26 8-48 30-66 46-38 82-90 82-160 0-104-84-190-196-190z" fill="#14163A"/><rect x="318" y="606" width="164" height="44" rx="22" fill="#14163A"/><rect x="338" y="668" width="124" height="40" rx="20" fill="#14163A"/><path d="M318 268h58v104l92-104h74l-104 114 112 138h-76l-78-100-20 22v78h-58z" fill="#FFD21F"/><circle cx="548" cy="250" r="30" fill="#FF5A3C"/></svg>KNOW THIS DAILY</b><span id="kicker"></span></div>
          <div id="head-rule"></div>
          <div id="dots"></div>
        </div>
        <h1 id="hook"></h1>
        <div id="overlays"></div>
        <div id="sub-rule"></div>
        <div id="subs" data-layout-allow-caption-zone></div>
        <div id="grain" class="layer" data-layout-ignore></div>
        <div id="endcard" class="layer">
          <svg viewBox="0 0 800 800"><rect width="800" height="800" fill="#FFD21F"/><g stroke="#14163A" stroke-width="26" stroke-linecap="round"><path d="M400 70v60M178 150l42 44M622 150l-42 44M92 360h60M708 360h-60"/></g><path d="M400 170c-112 0-196 86-196 190 0 70 36 122 82 160 22 18 30 40 30 66h168c0-26 8-48 30-66 46-38 82-90 82-160 0-104-84-190-196-190z" fill="#14163A"/><rect x="318" y="606" width="164" height="44" rx="22" fill="#14163A"/><rect x="338" y="668" width="124" height="40" rx="20" fill="#14163A"/><path d="M318 268h58v104l92-104h74l-104 114 112 138h-76l-78-100-20 22v78h-58z" fill="#FFD21F"/><circle cx="548" cy="250" r="30" fill="#FF5A3C"/></svg>
          <div id="end-name">Know This Daily</div>
          <div id="end-line">Follow for <b>one new thing</b><br />every day</div>
        </div>
      </div>
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-duration="__VOICE_DURATION__" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      // The film engine. Everything is a function of timeline time: the same render every time.
      const F = window.FILM;
      const END = F.duration;
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);
      const reps = (span, cycle) => Math.max(0, Math.floor(span / cycle) - 1);
      const TAMIL = /[\u0b80-\u0bff]/;
      // Words written all in capitals read as shouting in a serif: show them as a title instead.
      const calm = (t) => (t && t === t.toUpperCase() && /[A-Z]/.test(t)) ? t.toLowerCase().replace(/(^|[\s(\-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : t;
      window.KTD_CALM = calm;

      // ---- The film's colour and its label, from its topic ----
      const LOOKS = {
        heritage: ["#c2491d", "HISTORY"], space: ["#5b3fd1", "SPACE"], ocean: ["#0b7a86", "OCEAN"], nature: ["#3d7a2a", "NATURE"],
        tech: ["#0b6bd3", "TECH"], kids: ["#e0407a", "STORY"], night: ["#2743c4", "KNOW THIS"],
      };
      const [ACCENT, KICKER] = LOOKS[F.theme] || LOOKS.night;
      document.documentElement.style.setProperty("--accent", ACCENT);
      q("#kicker").textContent = KICKER;

      // ---- Camera moves: scale, x/y in percent of the card, roll in degrees, plus a little 3D turn ----
      const MOVES = {
        push_in:    [{ s: 1.06, x: 0, y: 0, r: 0 }, { s: 1.24, x: 0, y: -1.5, r: 0 }],
        pull_out:   [{ s: 1.28, x: 0, y: 1.5, r: 0 }, { s: 1.07, x: 0, y: 0, r: 0 }],
        pan_left:   [{ s: 1.2, x: 4.5, y: 0, r: 0 }, { s: 1.2, x: -4.5, y: 0, r: 0 }],
        pan_right:  [{ s: 1.2, x: -4.5, y: 0, r: 0 }, { s: 1.2, x: 4.5, y: 0, r: 0 }],
        tilt_up:    [{ s: 1.2, x: 0, y: 5.5, r: 0 }, { s: 1.2, x: 0, y: -5.5, r: 0 }],
        tilt_down:  [{ s: 1.2, x: 0, y: -5.5, r: 0 }, { s: 1.2, x: 0, y: 5.5, r: 0 }],
        drift:      [{ s: 1.12, x: -2, y: 1, r: -0.7 }, { s: 1.19, x: 2, y: -1, r: 0.7 }],
        crash_zoom: [{ s: 1.0, x: 0, y: 0, r: 0 }, { s: 1.32, x: 0, y: -2, r: 0 }],
        orbit:      [{ s: 1.18, x: -3, y: 0, r: -1.2 }, { s: 1.18, x: 3, y: 0, r: 1.2 }],
      };
      const FRAMING_ZOOM = { wide: 0, medium: 0.02, close: 0.06, extreme_close: 0.1, aerial: 0, low_angle: 0.03 };
      const GRADES = {
        mysterious: "rgba(30, 80, 160, 0.34)", dramatic: "rgba(255, 120, 40, 0.28)", happy: "rgba(255, 200, 110, 0.26)",
        sad: "rgba(70, 90, 140, 0.36)", excited: "rgba(255, 70, 130, 0.22)", calm: "rgba(90, 160, 170, 0.24)",
        curious: "rgba(130, 100, 255, 0.22)", epic: "rgba(255, 170, 60, 0.3)", tense: "rgba(200, 40, 40, 0.26)",
      };

      // ---- Shots: camera, 3D turn and the transition into each ----
      const drawn = (s) => s.kind === "anim" || s.kind === "scene"; // drawings on the page, not pictures in the card
      F.shots.forEach((s, i) => {
        const el = q(`#shot-${i}`), fx = el.querySelector(".fx"), cam = el.querySelector(".cam");
        // Animated scenes get a gentle push only: their drawing fills the page and must stay readable.
        const [a, b] = drawn(s) ? [{ s: 1, x: 0, y: 0, r: 0 }, { s: 1.02, x: 0, y: 0, r: 0 }] : (MOVES[s.move] || MOVES.drift);
        const z = drawn(s) ? 0 : (FRAMING_ZOOM[s.framing] || 0);
        const t0 = s.clipStart, t1 = s.clipEnd;
        const dir = i % 2 ? 1 : -1;
        const turn = drawn(s) ? 0 : 1;
        gsap.set(cam, { transformPerspective: 1400, transformOrigin: "50% 50%" });
        tl.fromTo(cam,
          { scale: a.s + z, xPercent: a.x, yPercent: a.y, rotation: a.r, rotationY: 1.6 * dir * turn, rotationX: -0.8 * turn },
          { scale: b.s + z, xPercent: b.x, yPercent: b.y, rotation: b.r, rotationY: -1.6 * dir * turn, rotationX: 0.8 * turn,
            duration: t1 - t0, ease: s.move === "crash_zoom" ? "expo.out" : "sine.inOut" }, t0);
        // A drawing leaves softly when a picture follows it: the card is waiting underneath.
        const next = F.shots[i + 1];
        if (drawn(s) && next && !drawn(next)) tl.to(fx, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, s.end - 0.28);

        if (i === 0) return;
        const before = F.shots[i - 1];
        const prev = drawn(before) === drawn(s) ? q(`#shot-${i - 1} .fx`) : null; // only shots on the same surface push each other
        const at = s.start;
        switch (s.transition) {
          case "fade":
            tl.fromTo(fx, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.inOut" }, at - 0.55);
            break;
          case "whip":
            if (prev) tl.fromTo(prev, { xPercent: 0 }, { xPercent: -100 * dir, duration: 0.3, ease: "power3.inOut", immediateRender: false }, at - 0.25);
            tl.fromTo(fx, { xPercent: 100 * dir }, { xPercent: 0, duration: 0.3, ease: "power3.inOut" }, at - 0.25);
            break;
          case "zoom":
            if (prev) tl.fromTo(prev, { scale: 1, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.32, ease: "power3.in", immediateRender: false }, at - 0.3);
            tl.fromTo(fx, { scale: 1.35 }, { scale: 1, duration: 0.55, ease: "power3.out" }, at - 0.3);
            break;
          case "iris":
            tl.fromTo(fx, { clipPath: "circle(0% at 50% 45%)" }, { clipPath: "circle(120% at 50% 45%)", duration: 0.5, ease: "power2.inOut" }, at - 0.4);
            break;
          case "flash":
            tl.fromTo("#flash", { opacity: 0, backgroundColor: "#fffaf0" }, { opacity: 0.92, duration: 0.08, ease: "power2.in", immediateRender: false }, at - 0.08)
              .to("#flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, at);
            break;
          case "dip":
            tl.fromTo("#flash", { opacity: 0, backgroundColor: "#1c1a17" }, { opacity: 1, duration: 0.28, ease: "power2.in", immediateRender: false }, at - 0.28)
              .to("#flash", { opacity: 0, duration: 0.38, ease: "power2.out" }, at);
            break;
          default: // cut: the clip windows already switch at this instant
            break;
        }
        // A warm light leak washes across the fast cuts.
        if (["whip", "zoom", "flash"].includes(s.transition) && !drawn(s)) {
          tl.fromTo("#leak", { xPercent: -70, opacity: 0 }, { xPercent: 40, opacity: 0.5, duration: 0.45, ease: "power2.in", immediateRender: false }, at - 0.35)
            .to("#leak", { xPercent: 90, opacity: 0, duration: 0.5, ease: "power2.out" }, at + 0.1);
        }
      });
      gsap.set("#leak", { opacity: 0 });

      // ---- Animated scenes ----
      F.shots.forEach((s, i) => {
        if (s.kind !== "anim") return;
        // The fact page shows a round crop of the nearest picture, so the number stays tied to the story.
        const near = F.shots.map((x, k) => k).filter((k) => F.shots[k].kind === "photo").sort((a, b) => Math.abs(a - i) - Math.abs(b - i))[0];
        window.buildAnim(q(`#anim-${i}`), { ...s, pic: near == null ? "" : `assets/shot-${near}.jpg` }, tl, ACCENT, F.theme);
      });
      gsap.set("#flash", { opacity: 0 });

      // ---- Colour grade inside the card follows each picture's mood ----
      F.shots.forEach((s, i) => {
        const c = drawn(s) ? "rgba(0, 0, 0, 0)" : (GRADES[s.mood] || "rgba(0, 0, 0, 0)");
        if (i === 0) gsap.set("#grade", { backgroundColor: c });
        else tl.to("#grade", { backgroundColor: c, duration: 0.6, ease: "sine.inOut" }, s.start - 0.3);
      });

      // ---- Paper grain ----
      tl.to("#grain", { x: 240, y: 170, duration: END, ease: `steps(${Math.round(END * 12)})` }, 0);

      // ---- Header: the rule draws in, each shot fills its dot while it is on screen ----
      tl.fromTo("#head-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.05);
      const dots = q("#dots");
      F.shots.forEach((s) => {
        const d = document.createElement("i");
        dots.appendChild(d);
        tl.fromTo(d, { "--p": 0 }, { "--p": 1, duration: Math.max(0.2, s.end - s.start), ease: "none" }, s.start);
      });
      tl.to(["#head", "#sub-rule"], { opacity: 0, duration: 0.3 }, F.endStart);

      // ---- The card makes room for a title under it (the hook, big words, a counter), then grows back ----
      const FULL = { height: 1110 }, LOW = { height: 842 };
      const titled = (s, i) => (i === 0 && F.hook) || (s.overlay && ["big_text", "counter"].includes(s.overlay.kind) && i > 0);
      const hookEnd = Math.min(F.shots[0].end - 0.25, 3.4);
      let low = !!titled(F.shots[0], 0);
      gsap.set("#frame", low ? LOW : FULL);
      const move = (to, at) => tl.to("#frame", { ...to, duration: 0.6, ease: "power3.inOut" }, Math.max(0, at));
      if (low && !(F.shots[0].overlay && F.shots[0].overlay.kind !== "none")) { move(FULL, hookEnd - 0.1); low = false; }
      F.shots.forEach((s, i) => {
        if (i === 0 || drawn(s)) return;
        const want = !!titled(s, i);
        if (want !== low) { move(want ? LOW : FULL, s.start - 0.3); low = want; }
        if (want) { move(FULL, s.end - 0.5); low = false; }
      });

      // ---- Hook above the first picture: word by word, then the marker runs under the last word ----
      const hook = q("#hook");
      const words = calm(F.hook).split(/\s+/).filter(Boolean);
      hook.innerHTML = words.map((w, i) => `<span class="w${i === words.length - 1 ? " hl" : ""}">${w}</span>`).join(" ");
      hook.classList.toggle("long", F.hook.length > 26);
      hook.classList.toggle("ta", TAMIL.test(F.hook));
      if (words.length) {
        tl.fromTo("#hook .w", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "power3.out" }, 0.1);
        tl.fromTo("#hook .hl", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.45, ease: "power2.out" }, 0.25 + words.length * 0.08);
        tl.to("#hook", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, hookEnd - 0.3);
      }

      // ---- On-screen graphics: big words and counters above the card, a label on it ----
      const ovs = q("#overlays"), tags = q("#tags");
      const fmt = (n) => Math.round(n).toLocaleString("en-US");
      F.shots.forEach((s, i) => {
        const o = s.overlay;
        if (!o || !o.kind || o.kind === "none" || i === 0 || drawn(s)) return;
        const el = document.createElement("div");
        el.id = `ov-${i}`;
        const inAt = s.voiceStart + 0.15, outAt = s.end - 0.55;
        if (o.kind === "big_text") {
          el.className = "ov ov-big" + (TAMIL.test(o.text) ? " ta" : "");
          el.textContent = calm(o.text);
          ovs.appendChild(el);
          tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, inAt);
        } else if (o.kind === "counter") {
          el.className = "ov ov-count";
          el.innerHTML = `<div class="num"><span class="v">0</span><span class="sfx"></span></div><div class="cap"></div>`;
          el.querySelector(".sfx").textContent = (o.suffix || "").trim();
          el.querySelector(".cap").textContent = o.text || "";
          ovs.appendChild(el);
          const num = el.querySelector(".v"), box = { v: 0 }, val = Number(o.value) || 0;
          tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, inAt);
          tl.fromTo(box, { v: 0 }, { v: val, duration: 1.3, ease: "power2.out", onUpdate: () => { num.textContent = fmt(box.v); } }, inAt);
        } else if (o.kind === "label") {
          el.className = "ov-label";
          el.textContent = o.text;
          tags.appendChild(el);
          tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, inAt);
        }
        tl.to(el, { opacity: 0, duration: 0.2, ease: "power2.in" }, outAt);
        tl.set(el, { visibility: "hidden" }, outAt + 0.2);
      });

      // ---- Captions, a few words at a time; the marker runs under the *key word* ----
      const subs = q("#subs");
      const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      tl.fromTo("#sub-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, Math.max(0, (F.subs[0] ? F.subs[0].start : 0.3) - 0.2));
      F.subs.forEach((c, i) => {
        const el = document.createElement("div");
        el.className = "sub" + (TAMIL.test(c.text) ? " ta" : "");
        el.id = `sub-${i}`;
        el.innerHTML = esc(c.text).replace(/\*([^*]+)\*/g, "<b>$1</b>");
        subs.appendChild(el);
        tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, c.start);
        const key = el.querySelector("b");
        if (key) tl.fromTo(key, { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.3, ease: "power2.out" }, c.start + 0.12);
        tl.to(el, { opacity: 0, duration: 0.1, ease: "power2.in" }, c.end - 0.1);
        tl.set(el, { visibility: "hidden" }, c.end);
      });

      // ---- End card ----
      const E = F.endStart;
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, E);
      tl.fromTo("#endcard svg", { scale: 0.5, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, E + 0.1);
      tl.fromTo("#end-name", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, E + 0.35);
      tl.fromTo("#end-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, E + 0.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
